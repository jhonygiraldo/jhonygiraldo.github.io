<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Four prediction levels in graph machine learning</title>
  <desc id="desc">Four copies of a graph highlight a node, an edge, a community, and the whole graph to illustrate node-, edge-, subgraph-, and graph-level tasks.</desc>
  <defs>
    <style>
      .panel{fill:#fff;stroke:#dbe2df;stroke-width:2}.edge{stroke:#9aaeb1;stroke-width:5;stroke-linecap:round}.edgehot{stroke:#d2644b;stroke-width:10}.node{fill:#b9c8c9;stroke:#fff;stroke-width:4}.hot{fill:#d2644b}.community{fill:#0f6c78}.label{font:700 25px system-ui,sans-serif;fill:#16343c;text-anchor:middle}.small{font:500 17px system-ui,sans-serif;fill:#586874;text-anchor:middle}.halo{fill:#dceff0;stroke:#0f6c78;stroke-width:3;stroke-dasharray:8 7}
    </style>
    <g id="basegraph">
      <path class="edge" d="M65 110L142 62L225 104L196 190L105 200L65 110M142 62L196 190M65 110L105 200M225 104L285 180M196 190L285 180"/>
      <circle class="node" cx="65" cy="110" r="19"/><circle class="node" cx="142" cy="62" r="19"/><circle class="node" cx="225" cy="104" r="19"/><circle class="node" cx="196" cy="190" r="19"/><circle class="node" cx="105" cy="200" r="19"/><circle class="node" cx="285" cy="180" r="19"/>
    </g>
  </defs>
  <rect class="panel" x="18" y="18" width="276" height="462" rx="24"/><rect class="panel" x="314" y="18" width="276" height="462" rx="24"/><rect class="panel" x="610" y="18" width="276" height="462" rx="24"/><rect class="panel" x="906" y="18" width="276" height="462" rx="24"/>
  <g transform="translate(4,88) scale(.85)"><use href="#basegraph"/><circle class="node hot" cx="142" cy="62" r="23"/></g>
  <text class="label" x="156" y="355">Node level</text><text class="small" x="156" y="386">What is this node?</text><text class="small" x="156" y="414">Example: classify a paper</text>
  <g transform="translate(300,88) scale(.85)"><use href="#basegraph"/><path class="edge edgehot" d="M142 62L225 104"/><circle class="node" cx="142" cy="62" r="19"/><circle class="node" cx="225" cy="104" r="19"/></g>
  <text class="label" x="452" y="355">Edge level</text><text class="small" x="452" y="386">Will these nodes connect?</text><text class="small" x="452" y="414">Example: recommend an item</text>
  <g transform="translate(596,88) scale(.85)"><ellipse class="halo" cx="136" cy="126" rx="111" ry="112"/><use href="#basegraph"/><circle class="node community" cx="65" cy="110" r="19"/><circle class="node community" cx="142" cy="62" r="19"/><circle class="node community" cx="196" cy="190" r="19"/><circle class="node community" cx="105" cy="200" r="19"/></g>
  <text class="label" x="748" y="355">Subgraph level</text><text class="small" x="748" y="386">Which nodes form a group?</text><text class="small" x="748" y="414">Example: find a community</text>
  <g transform="translate(892,88) scale(.85)"><rect x="18" y="20" width="304" height="225" rx="30" fill="#f9e9e2" stroke="#d2644b" stroke-width="4"/><use href="#basegraph"/></g>
  <text class="label" x="1044" y="355">Graph level</text><text class="small" x="1044" y="386">What does this graph represent?</text><text class="small" x="1044" y="414">Example: predict toxicity</text>
</svg>

