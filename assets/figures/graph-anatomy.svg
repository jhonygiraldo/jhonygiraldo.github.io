<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Undirected, directed, and weighted graphs</title>
  <desc id="desc">Three panels compare the same six-node network represented with undirected edges, directed arrows, and weighted edges.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#d2644b"/>
    </marker>
    <style>
      .panel{fill:#fff;stroke:#dbe2df;stroke-width:2}.edge{stroke:#789096;stroke-width:4;stroke-linecap:round}.directed{stroke:#d2644b;marker-end:url(#arrow)}.node{fill:#0f6c78;stroke:#fff;stroke-width:5}.label{font:700 26px system-ui,sans-serif;fill:#16343c}.small{font:500 18px system-ui,sans-serif;fill:#586874}.n{font:700 17px system-ui,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:middle}.weight{font:700 16px system-ui,sans-serif;fill:#9c4b36;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
    </style>
  </defs>
  <rect class="panel" x="18" y="18" width="370" height="394" rx="24"/>
  <rect class="panel" x="415" y="18" width="370" height="394" rx="24"/>
  <rect class="panel" x="812" y="18" width="370" height="394" rx="24"/>
  <text class="label" x="48" y="62">Undirected</text><text class="small" x="48" y="90">relations are symmetric</text>
  <text class="label" x="445" y="62">Directed</text><text class="small" x="445" y="90">relations have orientation</text>
  <text class="label" x="842" y="62">Weighted</text><text class="small" x="842" y="90">relations have strength</text>
  <g transform="translate(0,4)">
    <path class="edge" d="M105 190L202 135M202 135L298 190M105 190L140 305M202 135L220 270M298 190L220 270M140 305L220 270M220 270L310 325"/>
    <circle class="node" cx="105" cy="190" r="25"/><circle class="node" cx="202" cy="135" r="25"/><circle class="node" cx="298" cy="190" r="25"/><circle class="node" cx="140" cy="305" r="25"/><circle class="node" cx="220" cy="270" r="25"/><circle class="node" cx="310" cy="325" r="25"/>
    <text class="n" x="105" y="190">1</text><text class="n" x="202" y="135">2</text><text class="n" x="298" y="190">3</text><text class="n" x="140" y="305">4</text><text class="n" x="220" y="270">5</text><text class="n" x="310" y="325">6</text>
  </g>
  <g transform="translate(397,4)">
    <path class="edge directed" d="M105 190L178 148M202 135L275 178M110 215L133 279M195 158L214 240M277 207L239 255M163 294L192 280M242 285L285 313"/>
    <circle class="node" cx="105" cy="190" r="25"/><circle class="node" cx="202" cy="135" r="25"/><circle class="node" cx="298" cy="190" r="25"/><circle class="node" cx="140" cy="305" r="25"/><circle class="node" cx="220" cy="270" r="25"/><circle class="node" cx="310" cy="325" r="25"/>
    <text class="n" x="105" y="190">1</text><text class="n" x="202" y="135">2</text><text class="n" x="298" y="190">3</text><text class="n" x="140" y="305">4</text><text class="n" x="220" y="270">5</text><text class="n" x="310" y="325">6</text>
  </g>
  <g transform="translate(794,4)">
    <path class="edge" d="M105 190L202 135M202 135L298 190M105 190L140 305M202 135L220 270M298 190L220 270M140 305L220 270M220 270L310 325"/>
    <text class="weight" x="145" y="151">0.8</text><text class="weight" x="253" y="151">1.2</text><text class="weight" x="101" y="258">0.3</text><text class="weight" x="194" y="211">2.1</text><text class="weight" x="275" y="250">0.6</text><text class="weight" x="177" y="307">1.0</text><text class="weight" x="273" y="302">1.7</text>
    <circle class="node" cx="105" cy="190" r="25"/><circle class="node" cx="202" cy="135" r="25"/><circle class="node" cx="298" cy="190" r="25"/><circle class="node" cx="140" cy="305" r="25"/><circle class="node" cx="220" cy="270" r="25"/><circle class="node" cx="310" cy="325" r="25"/>
    <text class="n" x="105" y="190">1</text><text class="n" x="202" y="135">2</text><text class="n" x="298" y="190">3</text><text class="n" x="140" y="305">4</text><text class="n" x="220" y="270">5</text><text class="n" x="310" y="325">6</text>
  </g>
</svg>

