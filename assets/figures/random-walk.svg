<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Random walk and node-context pairs</title>
  <desc id="desc">A graph contains a highlighted random walk from node u through nodes a, b, c, and d. The walk becomes training pairs centered on node b.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#9cb0b3"/></marker>
    <style>
      .panel{fill:#fff;stroke:#dbe2df;stroke-width:2}.edge{stroke:#9fb0b3;stroke-width:5;stroke-linecap:round}.walk{fill:none;stroke:#d2644b;stroke-width:11;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.node{fill:#0f6c78;stroke:#fff;stroke-width:5}.visited{fill:#d2644b}.n{font:800 20px system-ui,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:middle}.label{font:700 27px system-ui,sans-serif;fill:#16343c}.small{font:500 18px system-ui,sans-serif;fill:#586874}.token{fill:#edf6f5;stroke:#a6c7c9;stroke-width:2}.tokenhot{fill:#f9e9e2;stroke:#d2644b;stroke-width:3}.t{font:700 22px ui-monospace,monospace;fill:#17353d;text-anchor:middle;dominant-baseline:middle}.pair{font:600 22px ui-monospace,monospace;fill:#33474f}
    </style>
  </defs>
  <rect class="panel" x="20" y="20" width="590" height="440" rx="24"/><rect class="panel" x="635" y="20" width="545" height="440" rx="24"/>
  <text class="label" x="55" y="67">1 · Sample a walk</text><text class="small" x="55" y="95">Nodes co-occurring in a window become similar.</text>
  <path class="edge" d="M92 250L185 145L300 190L408 118L520 195L470 330L335 354L215 318L92 250M185 145L215 318M300 190L335 354M300 190L520 195M408 118L470 330"/>
  <path class="walk" d="M92 250L185 145L300 190L408 118L520 195"/>
  <circle class="node visited" cx="92" cy="250" r="27"/><circle class="node visited" cx="185" cy="145" r="27"/><circle class="node visited" cx="300" cy="190" r="27"/><circle class="node visited" cx="408" cy="118" r="27"/><circle class="node visited" cx="520" cy="195" r="27"/><circle class="node" cx="470" cy="330" r="27"/><circle class="node" cx="335" cy="354" r="27"/><circle class="node" cx="215" cy="318" r="27"/>
  <text class="n" x="92" y="250">u</text><text class="n" x="185" y="145">a</text><text class="n" x="300" y="190">b</text><text class="n" x="408" y="118">c</text><text class="n" x="520" y="195">d</text><text class="n" x="470" y="330">e</text><text class="n" x="335" y="354">f</text><text class="n" x="215" y="318">g</text>
  <text class="label" x="670" y="67">2 · Predict context nodes</text><text class="small" x="670" y="95">Example context window of radius two around b.</text>
  <g transform="translate(690,130)"><rect class="token" x="0" y="0" width="70" height="62" rx="14"/><rect class="token" x="82" y="0" width="70" height="62" rx="14"/><rect class="tokenhot" x="164" y="0" width="70" height="62" rx="14"/><rect class="token" x="246" y="0" width="70" height="62" rx="14"/><rect class="token" x="328" y="0" width="70" height="62" rx="14"/><text class="t" x="35" y="31">u</text><text class="t" x="117" y="31">a</text><text class="t" x="199" y="31">b</text><text class="t" x="281" y="31">c</text><text class="t" x="363" y="31">d</text></g>
  <text class="pair" x="735" y="260">positive pairs</text><text class="pair" x="760" y="302">(b,u)  (b,a)</text><text class="pair" x="760" y="342">(b,c)  (b,d)</text><text class="small" x="700" y="403">Increase zᵦᵀzᵥ for context nodes; decrease it for sampled negatives.</text>
</svg>

